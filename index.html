<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aura - Roupas Minimalistas</title>
  <style>
    /* Reset básico */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #fff;
      color: #222;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-weight: 300;
    }

    header {
      background: #f5f5f5;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    header .logo {
      font-size: 1.8rem;
      font-weight: 600;
      color: #111;
      letter-spacing: 2px;
      user-select: none;
    }

    nav a {
      color: #111;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 400;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #7a5c38; /* tom bege escuro */
    }

    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 65vh;
      background: url('https://images.unsplash.com/photo-1521334884684-d80222895322?auto=format&fit=crop&w=1350&q=80') no-repeat center/cover;
      color: #fff;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .hero p {
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .btn-whatsapp {
      background: #25D366;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(37,211,102,0.4);
      transition: background 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 600;
      user-select: none;
    }

    .btn-whatsapp:hover {
      background: #1ebe5b;
    }

    main {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      flex-grow: 1;
    }

    section {
      margin-bottom: 60px;
    }

    h2 {
      font-weight: 600;
      font-size: 2rem;
      margin-bottom: 25px;
      color: #7a5c38;
      text-align: center;
      letter-spacing: 1.5px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
      gap: 30px;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: #fafafa;
      transition: box-shadow 0.3s ease;
    }

    .product-card:hover {
      box-shadow: 0 6px 15px rgba(122,92,56,0.3);
    }

    .product-card img {
      width: 100%;
      display: block;
      object-fit: cover;
      height: 320px;
      border-bottom: 1px solid #ddd;
    }

    .product-info {
      padding: 15px 20px;
      text-align: center;
    }

    .product-info h3 {
      font-weight: 500;
      margin-bottom: 10px;
      font-size: 1.2rem;
      color: #333;
    }

    .product-info p {
      color: #666;
      font-weight: 300;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .product-info a {
      text-decoration: none;
      background: #7a5c38;
      color: #fff;
      padding: 10px 25px;
      border-radius: 25px;
      font-weight: 600;
      transition: background 0.3s ease;
      display: inline-block;
    }

    .product-info a:hover {
      background: #5b442c;
    }

    footer {
      background: #f5f5f5;
      text-align: center;
      padding: 25px 20px;
      font-size: 0.9rem;
      color: #666;
      border-top: 1px solid #ddd;
      user-select: none;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 2.2rem;
      }
      .hero p {
        font-size: 1rem;
      }
      nav a {
        margin-left: 15px;
        font-size: 0.9rem;
      }
      .product-card img {
        height: 240px;
      }
    }

  </style>
</head>
